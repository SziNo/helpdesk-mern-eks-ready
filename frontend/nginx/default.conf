# Helpdesk frontend - nginx konfiguráció (nginxinc/nginx-unprivileged image)
# Csak a statikus React buildet szolgálja ki. Az /api-t SZÁNDÉKOSAN nem
# proxyzza: azt a Kubernetes Gateway (helyben a docker-compose gateway) irányítja
# közvetlenül a backendre.

server {
    # Nem root felhasználóként nem lehet 1024 alatti portot nyitni
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne áruljuk el a pontos nginx verziót
    server_tokens off;

    # Liveness / readiness probe. A SPA fallback ELŐTT áll, és pontos egyezés (=),
    # így erre sosem az index.html jön vissza.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A Vite által hash-elt nevű fájlok (pl. /assets/index-Ba7u1zGD.js):
    # a tartalom változásakor a név is változik, ezért hosszan cache-elhetők.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Az index.html-t mindig újra kell ellenőrizni, különben egy új kiadás után
    # a böngésző a régi (már nem létező) asset fájlokra hivatkozna.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: a React Router útvonalai (pl. /tickets) frissítéskor se adjanak
    # 404-et; minden nem létező fájl helyett az index.html megy vissza.
    location / {
        try_files $uri /index.html;
    }
}
