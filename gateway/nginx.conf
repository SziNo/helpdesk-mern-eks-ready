# Helyi "gateway" - CSAK a docker-compose-hoz.
# A későbbi Kubernetes Gateway API (HTTPRoute) útválasztását utánozza:
#   PathPrefix /api  -> backend:8080
#   PathPrefix /     -> frontend:8080
# Ugyanúgy beállítja a X-Forwarded-For / X-Real-IP fejléceket, mint egy valódi
# gateway / load balancer, így a backend "trust proxy" beállítása helyben is
# tesztelhető.

# A docker belső DNS-e; a változóba tett upstream miatt az nginx akkor is
# elindul, ha a backend / frontend konténer még nem él.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Közös proxy fejlécek
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # A gateway saját állapota (a compose healthcheckhez)
    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # PathPrefix /api: az /api és az /api/... egyezik, az /apifoo nem
    # (ugyanúgy, mint a Gateway API PathPrefix illesztése).
    location = /api {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }
    location /api/ {
        set $backend http://backend:8080;
        # Változós proxy_pass esetén az eredeti URI változatlanul továbbmegy
        proxy_pass $backend;
    }

    # Minden más a frontendre
    location / {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }
}
